[project]
name = "wrotransit-backend"
version = "0.1.0"
description = "WroTransit backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13.3",
  "psycopg[binary]>=3.2.3",
  "geoalchemy2>=0.15.2",
  "shapely>=2.0.6",
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  # starlette.testclient (used by our `client` test fixture) warns and falls back to
  # `httpx` without this - it's unrelated to the real httpx client MpkSource uses.
  "httpx2>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["api*", "ingest*"]
