services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wrotransit
      POSTGRES_USER: wrotransit
      POSTGRES_PASSWORD: wrotransit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://wrotransit:wrotransit@db:5432/wrotransit
    ports:
      - "8000:8000"
    depends_on:
      - db

  ingest:
    build:
      context: ./backend
    command: ["python", "-m", "ingest.vehicle_polling"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://wrotransit:wrotransit@db:5432/wrotransit
      # SOURCE (mpk|replay) and the REPLAY_* vars are read from .env, NOT hardcoded here -
      # an `environment:` entry would always win over .env, making SOURCE=replay in .env
      # impossible to use. ingest/config.py defaults to "mpk" when unset.
    volumes:
      - ./backend/data/recordings:/app/data/recordings
    depends_on:
      - db

volumes:
  pgdata:
